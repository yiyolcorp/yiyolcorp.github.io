<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232" role="img" aria-label="NOX-A08 시리즈 2U 랙마운트 서버 — 4열 2행 핫스왑 8베이">
  <style>
    .ledtext{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:1.5px;fill:#57c6ff;filter:drop-shadow(0 0 3px rgba(79,190,255,.85));}
    .accent{animation:accentpulse 3.2s ease-in-out infinite}
    @keyframes accentpulse{0%,100%{opacity:.8}50%{opacity:1}}
    .hddled{animation:hddblink 1.9s ease-in-out infinite}
    @keyframes hddblink{0%,72%{opacity:1}73%,100%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){.accent,.hddled{animation:none}}
  </style>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c31"/>
      <stop offset="0.07" stop-color="#191b1f"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#a3a7ae"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54585f"/>
      <stop offset="0.5" stop-color="#34373d"/>
      <stop offset="1" stop-color="#212327"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3138"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#1560d8"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffb0"/>
      <stop offset="1" stop-color="#0a8c3f"/>
    </radialGradient>
    <pattern id="mesh" width="9" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.25" fill="#000000" opacity="0.55"/>
    </pattern>
    <pattern id="ledgrid" width="3" height="3" patternUnits="userSpaceOnUse">
      <path d="M3 0H0V3" fill="none" stroke="#04060a" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- rack ears + handles -->
  <rect x="4" y="18" width="20" height="196" rx="4" fill="url(#metal)" stroke="#4b4f57" stroke-width="1"/>
  <rect x="976" y="18" width="20" height="196" rx="4" fill="url(#metal)" stroke="#4b4f57" stroke-width="1"/>
  <rect x="9" y="44" width="6" height="144" rx="3" fill="#0b0c0f"/>
  <rect x="985" y="44" width="6" height="144" rx="3" fill="#0b0c0f"/>
  <circle cx="14" cy="30" r="2.6" fill="#0b0c0f"/><circle cx="14" cy="202" r="2.6" fill="#0b0c0f"/>
  <circle cx="986" cy="30" r="2.6" fill="#0b0c0f"/><circle cx="986" cy="202" r="2.6" fill="#0b0c0f"/>


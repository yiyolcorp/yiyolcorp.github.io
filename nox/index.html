<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="NOX 제품 페이지가 nox.yiyol.com으로 이전되었습니다.">
  <link rel="canonical" href="https://nox.yiyol.com/">
  <meta http-equiv="refresh" content="0; url=https://nox.yiyol.com/">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CKJ4GX2KHS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CKJ4GX2KHS');

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      background: linear-gradient(140deg, #03080f 0%, #081428 50%, #0a1e35 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; line-height: 1.6;
    }
    .card {
      max-width: 460px; width: 100%; text-align: center;
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 2.5rem 2rem;
      backdrop-filter: blur(8px);
    }
    .eyebrow {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      color: #00b4d8; margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem; font-weight: 800; color: #f1f5f9;
      margin-bottom: 0.75rem; letter-spacing: -0.01em;
    }
    p { font-size: 0.95rem; color: #94a3b8; margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #00b4d8; color: #fff; font-weight: 700;
      padding: 0.8rem 1.6rem; border-radius: 6px; text-decoration: none;
      font-size: 0.95rem; transition: background 0.2s;
    }
    .btn:hover { background: #0096b7; }
    .url { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #00b4d8; }
    .home-link {
      display: inline-block; margin-top: 1.25rem;

  <main class="card">
    <div class="eyebrow">NOX has moved</div>
    <h1>NOX 제품 페이지가 이전되었습니다</h1>
    <p>
      NOX 소개와 가입은 이제 <span class="url">nox.yiyol.com</span> 에서 이용하실 수 있습니다.
      잠시 후 자동으로 이동합니다.
    </p>
    <a class="btn" href="https://nox.yiyol.com/">
      nox.yiyol.com으로 이동
    </a>
    <br>
    <a class="home-link" href="/">YIYOL 홈으로</a>
  </main>
  <script>
    // Immediate JS redirect as a backup to <meta refresh>
    setTimeout(function(){ window.location.replace('https://nox.yiyol.com/'); }, 100);
  </script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOX — Redirecting to nox.yiyol.com</title>
  <meta name="description" content="NOX 제품 페이지가 nox.yiyol.com으로 이전되었습니다.">
  <link rel="canonical" href="https://nox.yiyol.com/">
  <meta http-equiv="refresh" content="0; url=https://nox.yiyol.com/">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CKJ4GX2KHS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CKJ4GX2KHS');
  </script>
  <!-- Redirect interstitial: `meta refresh` fires at 0s, so this page is almost
       never painted. It therefore loads tokens.css ONLY — no webfonts, no
       site.css, no dark.css. Pulling four font families and three stylesheets
       for a view that lasts ~100ms was pure waste. Registered as an exception
       in design.md § Variants. -->
  <link rel="stylesheet" href="/assets/css/tokens.css?v=5" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: clip; }                     /* gate 34 */
    body {
      font-family: var(--font-body);
      background: var(--color-graphite);
      color: var(--color-on-dark-2);
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-xl) var(--space-md);
      line-height: 1.7;
      word-break: keep-all;
    }
    .card { max-width: 460px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: var(--text-xs); font-weight: 500;
      letter-spacing: var(--tracking-mono); text-transform: uppercase;
      color: var(--color-accent-bright); margin-bottom: var(--space-2xs);
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl); font-weight: 600;
      letter-spacing: var(--tracking-display);
      color: var(--color-on-dark);
      margin-bottom: var(--space-xs); line-height: 1.3;
      overflow-wrap: anywhere; min-width: 0;             /* gate 51 */
    }
    p { font-size: var(--text-base); margin-bottom: var(--space-md); }
    .url { font-family: var(--font-mono); color: var(--color-accent-bright); }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2xs);
      background: var(--color-accent); color: var(--color-accent-ink);
      font-weight: 500; font-size: var(--text-base);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-ctl); text-decoration: none;
      white-space: nowrap;                                /* gate 49 */
      transition: background-color var(--dur-fast) var(--ease-out);
    }
    .btn:hover  { background: var(--color-accent-hover); }
    .btn:active { background: var(--color-accent-hover); }
    :focus-visible { outline: 2px solid var(--color-accent-bright); outline-offset: 3px; transition: none; }
    .home-link {
      display: inline-block; margin-top: var(--space-sm);
      font-size: var(--text-sm); color: var(--color-on-dark-2); text-decoration: none;
      white-space: nowrap;                                /* gate 49 */
      transition: color var(--dur-fast) var(--ease-out);
    }
    .home-link:hover { color: var(--color-on-dark); }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 150ms !important; animation: none !important; }
    }
  </style>
  </head>
<body>
  <main class="card">
    <div class="eyebrow">NOX has moved</div>
    <h1>NOX 제품 페이지가 이전되었습니다</h1>
    <p>
      NOX 소개와 가입은 이제 <span class="url">nox.yiyol.com</span> 에서 이용하실 수 있습니다.
      잠시 후 자동으로 이동합니다.
    </p>
    <a class="btn" href="https://nox.yiyol.com/">
      nox.yiyol.com으로 이동
    </a>
    <br>
    <a class="home-link" href="/">YIYOL 홈으로</a>
  </main>
  <script>
    // Immediate JS redirect as a backup to <meta refresh>
    setTimeout(function(){ window.location.replace('https://nox.yiyol.com/'); }, 100);
  </script>
</body>
</html>

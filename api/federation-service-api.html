  <div class="nojs">
    <h1>Nox NVR Federation Service API</h1>
    <p>NOX↔NOX 페더레이션 좌표 서비스 (노드 레지스트리/페어링/토큰/채널 매핑)</p>
    <p>이 문서는 브라우저에서 대화형으로 렌더합니다. JavaScript 를 켜면
       요청·응답 스키마와 예제까지 볼 수 있습니다.</p>
    <h2>오퍼레이션 30개</h2>
    <ul>
      <li><code>GET /federation/api/v1/federation-replay/hls/{nodeId}/{fedSessionId}/{filename}</code> — HLS relay (스트리밍, Range 투과)</li>
      <li><code>GET /federation/api/v1/federation/failover/config-bundle</code> — failover Config Bundle (피어 API)</li>
      <li><code>GET /federation/api/v1/federation/failover/guardian</code> — failover guardian 조회 (피어/로컬 UI)</li>
      <li><code>GET /federation/api/v1/federation/failover/heartbeat</code> — failover heartbeat (피어 API)</li>
      <li><code>GET /federation/api/v1/federation/failover/protections</code> — failover 보호 관계 목록</li>
      <li><code>POST /federation/api/v1/federation/failover/protections</code> — failover 보호 대상 등록</li>
      <li><code>DELETE /federation/api/v1/federation/failover/protections/{id}</code> — failover 보호 해제</li>
      <li><code>POST /federation/api/v1/federation/failover/protections/{id}/failback</code> — failover 수동 복귀</li>
      <li><code>POST /federation/api/v1/federation/failover/protections/{id}/snapshot</code> — failover 스냅샷 즉시 갱신</li>
      <li><code>POST /federation/api/v1/federation/failover/protections/{id}/takeover</code> — failover 수동 인계</li>
      <li><code>GET /federation/api/v1/federation/failover/recordback/jobs</code> — record-back job 목록(admin)</li>
      <li><code>POST /federation/api/v1/federation/failover/recordback/jobs/{id}/pause</code> — record-back job 일시정지(admin)</li>
      <li><code>POST /federation/api/v1/federation/failover/recordback/jobs/{id}/resume</code> — record-back job 재개(admin)</li>
      <li><code>POST /federation/api/v1/federation/failover/recordback/jobs/{id}/retry</code> — record-back job 재시도(admin)</li>
      <li><code>POST /federation/api/v1/federation/failover/recordback/segments</code> — record-back 세그먼트 push(피어 API, multipart 스트리밍)</li>
      <li><code>POST /federation/api/v1/federation/failover/recordback/sessions</code> — record-back 세션 오픈 + DEK envelope(피어 API)</li>
      <li><code>GET /federation/api/v1/federation/failover/recordback/transfer-key</code> — record-back DEK 전송 공개키 조회(피어 API)</li>
      <li><code>GET /federation/api/v1/federation/failover/reroute-status</code> — failover 인계 상태 프로브 (피어 API, Phase 2a/3b)</li>
      <li><code>GET /federation/api/v1/federation/failover/reroutes</code> — 재라우팅 목록 (admin 대시보드, Phase 2a)</li>
      <li><code>GET /federation/api/v1/federation/failover/settings</code> — failover 설정 조회(유효값)</li>
      <li><code>PUT /federation/api/v1/federation/failover/settings</code> — failover 설정 변경(전체 객체)</li>
      <li><code>GET /federation/api/v1/federation/failover/status</code> — failover 경량 상태(배지/차단용, 다중 인계 + 용량 회계)</li>
      <li><code>GET /federation/api/v1/federation/nodes</code> — 페더레이션 노드 목록 조회</li>
      <li><code>PATCH /federation/api/v1/federation/nodes/order</code> — 페더레이션 노드 표시 순서 일괄 갱신</li>
      <li><code>POST /federation/api/v1/federation/nodes/pair-by-uuid</code> — 노드 페어링 요청(node_uuid 기반)</li>
      <li><code>GET /federation/api/v1/federation/nodes/{nodeId}</code> — 페더레이션 노드 단건 조회</li>
      <li><code>POST /federation/api/v1/federation/nodes/{nodeId}/pair</code> — 노드 페어링 요청</li>
      <li><code>DELETE /federation/api/v1/federation/nodes/{nodeId}/pair</code> — 노드 언페어</li>
      <li><code>POST /federation/api/v1/federation/nodes/{nodeId}/remap</code> — 채널 매핑 재구축</li>
      <li><code>GET /health</code> — 헬스체크</li>
    </ul>
  </div>

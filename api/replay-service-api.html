<script id="openapi-spec" type="application/json">{"swagger": "2.0", "info": {"description": "\n## 개요\n\nNOX NVR 의 녹화 재생 API 입니다. 녹화된 영상을 HLS 로 재생하고, 구간을 잘라\n클립으로 내보낼 수 있습니다.\n\n## 기본 URL\n\n```\nhttps://{서버 주소}/replay\n```\n\n모든 경로는 웹 서버(HTTPS)를 통해 `/replay` 접두로 접근합니다. 아래 각 엔드포인트에\n표기된 경로가 이미 접두를 포함한 실제 호출 경로입니다.\n\n## 인증\n\n모든 요청에 JWT 접근 토큰이 필요합니다.\n\n**1) 토큰 발급**\n\n```\nPOST https://{서버 주소}/auth/api/v1/auth/login\nContent-Type: application/json\n\n{ \"username\": \"admin\", \"password\": \"********\" }\n```\n\n응답:\n\n```json\n{\n  \"accessToken\": \"eyJhbGciOiJS...\",\n  \"refreshToken\": \"eyJhbGciOiJS...\",\n  \"expiresIn\": 600,\n  \"accessMode\": \"general\"\n}\n```\n\n**2) 요청에 부착**\n\n```\nAuthorization: Bearer {accessToken}\n```\n\n접근 토큰은 기본 10분 후 만료됩니다. `POST https://{서버 주소}/auth/api/v1/auth/refresh`\n에 `{\"refreshToken\": \"...\"}` 를 보내 갱신하십시오. 갱신 시 refresh 토큰도 함께\n회전하므로, 응답으로 받은 새 토큰으로 교체해야 합니다.\n\n**3) 헤더를 넣을 수 없는 경우**\n\nHLS 플레이어처럼 요청 헤더를 제어할 수 없는 클라이언트를 위해 쿼리 파라미터도\n지원합니다.\n\n```\nhttps://{서버 주소}/replay/api/v1/hls/{sessionId}/master.m3u8?token={accessToken}\n```\n\n## 재생 흐름\n\n**① 녹화 목록에서 `recording_token` 을 얻습니다**\n\n```\nGET https://{서버 주소}/record/api/v1/recordings\nAuthorization: Bearer {accessToken}\n```\n\n응답 배열의 각 항목에 있는 **`id` 값이 `recording_token`** 입니다. 이 값은\n재생 서비스가 발급하지 않으므로 반드시 이 단계를 먼저 거쳐야 합니다.\n\n**② 재생 세션을 생성합니다**\n\n```\nPOST https://{서버 주소}/replay/api/v1/replay/uri\nAuthorization: Bearer {accessToken}\nContent-Type: application/json\n\n{\n  \"recording_token\": \"6f1c...\",\n  \"start_time\": \"2026-08-30T09:00:00Z\",\n  \"end_time\": \"2026-08-30T09:10:00Z\"\n}\n```\n\n응답:\n\n```json\n{\n  \"media_uri\": \"/api/v1/hls/hls_2f9c.../master.m3u8\",\n  \"protocol\": \"HLS\",\n  \"playback_rate\": 1\n}\n```\n\n**③ 재생합니다**\n\n> ⚠️ **`media_uri` 에는 `/replay` 접두가 포함되어 있지 않습니다.**\n> 응답값은 서비스 내부 경로이므로, 실제 요청 URL 은 앞에 `/replay` 를 붙여\n> 만들어야 합니다.\n\n```\n실제 URL = https://{서버 주소}/replay + media_uri\n\n예) https://{서버 주소}/replay/api/v1/hls/hls_2f9c.../master.m3u8?token={accessToken}\n```\n\n이 URL 을 HLS 플레이어(hls.js, AVPlayer, ffmpeg 등)에 그대로 넘기면 됩니다.\n플레이리스트가 참조하는 세그먼트도 같은 접두 아래에서 제공됩니다.\n\n## 시간 형식\n\n`start_time` / `end_time` 은 **RFC 3339 (UTC)** 로 보냅니다.\n\n```\n2026-08-30T09:00:00Z\n```\n\n## 세션 수명\n\n재생 세션은 일정 시간 사용되지 않으면 만료됩니다. 만료 후에는 ② 를 다시 호출해\n새 세션을 받으십시오. 현재 설정값은 `GET /replay/api/v1/replay/config` 로 확인할 수\n있습니다.\n\n## 클립 내보내기\n\n구간을 파일로 내보내려면 `POST /replay/api/v1/clip/export` 로 작업을 만들고,\n`GET /replay/api/v1/clip/{clipId}/status` 로 진행 상태를 확인한 뒤\n`GET /replay/api/v1/clip/{clipId}/download` 로 내려받습니다. 여러 채널을 한 번에\n내보내려면 `POST /replay/api/v1/clip/multi-export` 를 사용합니다.\n\n## 오류 응답\n\n오류는 사람이 읽는 `error` 와 기계 판독용 `code` 를 함께 반환합니다.\n\n```json\n{ \"code\": \"INVALID_REQUEST\", \"error\": \"유효하지 않은 요청 데이터\" }\n```\n\n| 상태 | 의미 |\n|------|------|\n| 400 | 요청 본문/파라미터 오류 |\n| 401 | 토큰 없음·만료·유효하지 않음 |\n| 403 | 해당 녹화에 대한 권한 없음 |\n| 404 | 세션 또는 녹화를 찾을 수 없음 |\n\n\n---\n\nHLS 기반 녹화 재생 서비스", "title": "Nox NVR Replay Service API", "contact": {"name": "API Support", "email": "support@yiyol.com"}, "license": {"name": "Apache 2.0", "url": "http://www.apache.org/licenses/LICENSE-2.0.html"}, "version": "1.0"}, "host": "{서버 주소}", "basePath": "/", "paths": {"/replay/api/v1/clip/decrypt": {"post": {"description": "NOXV 파일을 복호화하여 원본 MP4로 반환합니다", "consumes": ["multipart/form-data"], "produces": ["application/octet-stream"], "tags": ["clip"], "summary": "클립 복호화", "parameters": [{"type": "file", "description": "NOXV 파일", "name": "file", "in": "formData", "required": true}, {"type": "string", "description": "백업 시 사용한 패스워드 (암호화 백업 필수, 평문 v3 백업은 불필요. v2는 복호화 API 미지원)", "name": "password", "in": "formData"}], "responses": {"200": {"description": "OK", "schema": {"type": "file"}}, "400": {"description": "Bad Request", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}}}}, "/replay/api/v1/clip/export": {"post": {"description": "녹화의 특정 구간을 NOXV 파일로 내보냅니다. 패스워드가 있으면 암호화하며, NIS 활성 모드에서는 패스워드(암호화)가 필수입니다. NIS 비활성 모드에서 패스워드를 생략하면 비암호화(평문) 백업이 생성됩니다.\n한도 초과(429) 응답도 다른 오류와 동일하게 본문의 code 필드(RATE_LIMITED)로 분기하며, 재시도 가능 시점은 Retry-After 헤더(초)로 전달합니다.\nformat 필드는 \"noxv\"(기본, 빈 값 포함)만 허용합니다. 단일 채널 산출물은 파일 탐색기에 file_id 1개로 저장되어 채널별 N파일 모델이 성립하지 않으므로 \"mp4\" 는 400 FORMAT_NOT_SUPPORTED 로 거부됩니다(MP4 백업은 multi-export 전용).", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["clip"], "summary": "클립 내보내기", "parameters": [{"description": "내보내기 요청", "name": "request", "in": "body", "required": true, "schema": {"$ref": "#/definitions/handlers.clipExportRequest"}}], "responses": {"200": {"description": "OK", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "400": {"description": "형식 오류 / MP4 미지원(FORMAT_NOT_SUPPORTED)", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "403": {"description": "Forbidden", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "429": {"description": "백업 시작 요청이 너무 잦습니다 (RATE_LIMITED, 사용자당 분당 약 10회, Retry-After 초)", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "500": {"description": "Internal Server Error", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}}}}, "/replay/api/v1/clip/history": {"get": {"description": "로그인 사용자의 클립 백업(내보내기) 이력을 최신순으로 조회합니다. 사용자당 최근 200건이 보존됩니다.", "produces": ["application/json"], "tags": ["clip"], "summary": "클립 백업 히스토리 조회", "parameters": [{"type": "integer", "description": "페이지 번호 (1부터, 최대 1000000 — 초과 시 상한으로 보정)", "name": "page", "in": "query"}, {"type": "integer", "description": "페이지 크기 (기본 20, 최대 100)", "name": "page_size", "in": "query"}, {"enum": ["processing", "ready", "error"], "type": "string", "description": "상태 필터", "name": "status", "in": "query"}], "responses": {"200": {"description": "OK", "schema": {"$ref": "#/definitions/models.ClipBackupHistoryResponse"}}, "400": {"description": "Bad Request", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "401": {"description": "Unauthorized", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "500": {"description": "Internal Server Error", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "503": {"description": "Service Unavailable", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}}}}, "/replay/api/v1/clip/multi-export": {"post": {"description": "여러 녹화 채널의 특정 구간을 NOXV v3 멀티트랙 파일로 내보냅니다.\nbackup_location 으로 산출물의 목적지를 고릅니다. \"local\"(기본, 빈 값 포함)은 이 노드에 연결된 외부 저장 매체에 기록하고, \"remote\" 는 산출물을 노드의 픽업 위치에 잠시 보존했다가 요청한 브라우저가 GET /clip/{clipId}/download 로 받아 가면 즉시 삭제합니다(받아 가지 않으면 약 1시간 뒤 자동 정리). remote 는 storage_id 지정·skip_resource_save 와 함께 쓸 수 없으며 두 경우 모두 잡 생성 전에 400 STORAGE_NOT_SUPPORTED 로 거부됩니다.\nremote + format=mp4 는 채널별 MP4 와 manifest.json 을 무압축 ZIP 하나로 묶어 픽업에 기록합니다(ZIP 최상위에 백업 디렉토리명 폴더 1개, 그 아래에 파일들). 단일 파일이므로 다운로드·삭제·보존 기간 계약이 NOXV 와 동일하며, 4GiB 초과는 zip64 로 처리되고 파일시스템 단일 파일 상한도 적용되지 않습니다.\n회수하지 않은 리모트 산출물이 스풀 파티션 용량의 1/10 을 넘게 누적되면 새 리모트 백업이 409 STORAGE_INSUFFICIENT_SPACE 로 거부됩니다(기존 백업을 내려받거나 보존 기간이 지나면 다시 허용됩니다).\n로컬 백업에서 storage_id(대상 파티션의 파일시스템 UUID)는 필수이며, 산출물은 그 외부 저장 매체의 루트에 원본 파일명(Multi_Clip_*.noxv)으로 직접 기록됩니다. 파일 탐색기에는 등록하지 않으므로 응답/상태의 file_id 는 비어 있고, 대신 상태·이력의 target_path 가 최종 경로를 제공합니다.\n대상은 시스템 디스크와 NOX 녹화 저장소를 제외한 마운트여야 하며, 잡을 만들기 전에 마운트·쓰기 가능성·여유 공간(최종 크기+256MiB)·파일시스템 크기 상한(FAT32 4GiB)을 검증합니다. 중간 산출물은 대상이 아니라 NOX 파티션 스풀에서 처리됩니다. 리모트 백업은 대상 매체가 없으므로 이 검증들을 적용하지 않고 스풀 축만 예약하며(요구량에 픽업 보존분이 가산됩니다) 409 STORAGE_INSUFFICIENT_SPACE 는 스풀 공간 부족을 뜻합니다.\nformat 필드로 산출물 컨테이너를 고릅니다. \"noxv\"(기본, 빈 값 포함)는 채널 N개를 한 파일 안의 N개 트랙으로 봉인하고, \"mp4\" 는 채널마다 별도 MP4 파일을 매체의 백업 디렉토리(Multi_Clip_{YYYYMMDD}_{HHMMSS}_{clipID8}/) 하나에 담아 무결성 매니페스트(manifest.json)와 함께 원자적으로 남깁니다. 값은 공백 제거 + 소문자로 정규화됩니다.\nmp4 는 NIS 비활성 모드 전용입니다(암호화·무결성 봉투가 없음). 비밀번호와 함께 쓸 수 없고 위임 백업(skip_resource_save)에도 쓸 수 없으며, 세 조건 모두 잡 생성 전에 400 으로 거부됩니다. 파일시스템 단일 파일 상한(FAT32 4GiB) 검사는 mp4 에서 총합이 아니라 채널별 최대 기준으로 적용됩니다.\n오류 분기는 HTTP 상태 코드가 아니라 응답의 code 필드(INVALID_REQUEST / STORAGE_REQUIRED / STORAGE_NOT_SUPPORTED / STORAGE_NOT_ALLOWED / STORAGE_NOT_FOUND / STORAGE_NOT_WRITABLE / STORAGE_INSUFFICIENT_SPACE / STORAGE_FILE_SIZE_LIMIT / STORAGE_SPACE_UNKNOWN / FORMAT_NOT_SUPPORTED / FORMAT_NOT_ALLOWED_NIS / FORMAT_PASSWORD_NOT_SUPPORTED / FORMAT_NOT_SUPPORTED_FOR_DELEGATED / RATE_LIMITED)로 합니다. NOT_IMPLEMENTED 는 이 엔드포인트에서 더 이상 발생하지 않습니다(페더레이션 위임 경로에는 남아 있습니다).", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["clip"], "summary": "멀티채널 클립 내보내기", "parameters": [{"description": "멀티채널 내보내기 요청", "name": "request", "in": "body", "required": true, "schema": {"$ref": "#/definitions/handlers.multiClipExportRequest"}}], "responses": {"200": {"description": "OK", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "400": {"description": "형식 오류(INVALID_REQUEST) / 대상 저장소 미지정(STORAGE_REQUIRED) / 대상이 될 수 없는 저장소(STORAGE_NOT_ALLOWED — NOX 녹화 저장소·시스템 디스크) / 위임·리모트 백업에 저장소 지정(STORAGE_NOT_SUPPORTED) / 알 수 없는 포맷(FORMAT_NOT_SUPPORTED) / NIS 활성에서 MP4(FORMAT_NOT_ALLOWED_NIS) / MP4 에 비밀번호(FORMAT_PASSWORD_NOT_SUPPORTED) / 위임 백업에 MP4(FORMAT_NOT_SUPPORTED_FOR_DELEGATED)", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "403": {"description": "Forbidden", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "404": {"description": "지정 저장소 해석 불가(STORAGE_NOT_FOUND — 분리되었거나 마운트되지 않음)", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "409": {"description": "여유 공간 부족(STORAGE_INSUFFICIENT_SPACE, required_bytes/available_bytes 포함) / 파일 크기 상한 초과(STORAGE_FILE_SIZE_LIMIT, limit_bytes 포함 — mp4 는 채널별 최대 기준이며 원인 채널이 메시지에 포함됨) / 쓰기 불가(STORAGE_NOT_WRITABLE) / 측정 실패(STORAGE_SPACE_UNKNOWN)", "schema": {"type": "object", "additionalProperties": true}}, "429": {"description": "백업 시작 요청이 너무 잦습니다 (RATE_LIMITED, 사용자당 분당 약 10회, Retry-After 초)", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}, "500": {"description": "Internal Server Error", "schema": {"type": "object", "additionalProperties": {"type": "string"}}}}}}, "/replay/api/v1/clip/storage/eject": {"post": {"description": "백업 대상으로 쓰는 외부 저장 매체(USB 등)를 안전하게 분리합니다. 진행 중인 백업이 그 매체를 대상으로 하면 409 로 거부합니다. 이미 분리된 매체는 200 + status=already_ejected 로 응답합니다(사용자 목표가 이미 달성된 상태를 실패로 만들지 않습니다).", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["clip"], "summary": "백업 매체 안전 분리", "parameters": [{"description": "대상 저장소", "name": "body", "in": "body", "required": true, "schema": {"$ref": "#/definitions/handlers.ejectStorageRequest"}}], "responses": {"200": {"description": "OK", "schema": {"type": "object", "additionalProperties": true}}, "400": {"description": "STORAGE_REQUIRED / STORAGE_NOT_ALLOWED", "schema": {"type": "object", "additionalProperties": true}}, "403": {"description": "STORAGE_NOT_ALLOWED (페더레이션 피어 주체)", "schema": {"type": "object", "additionalProperties": true}}, "409": {"description": "STORAGE_EJECT_IN_USE", "schema": {"type": "object", "additionalProperties": true}}}}}, "/replay/api/v1/clip/storage/format": {"post": {"description": "외부 저장 매체를 exFAT 으로 재포맷합니다. **매체의 모든 데이터가 삭제되며 되돌릴 수 없습니다.** confirm=true 가 없으면 거부합니다. 진행 중인 백업이 그 매체를 대상으로 하면 409 로 거부하며, 꺼내기와 달리 그 백업을 취소하지 않습니다. 파일시스템은 exFAT 고정으로 선택할 수 없습니다.", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["clip"], "summary": "백업 매체 포맷 (exFAT)", "parameters": [{"description": "대상 저장소와 확인 토큰", "name": "body", "in": "body", "required": true, "schema": {"$ref": "#/definitions/handlers.formatStorageRequest"}}], "responses": {"200": {"description": "OK", "schema": {"type": "object", "additionalProperties": true}}, "400": {"description": "STORAGE_REQUIRED / STORAGE_FORMAT_CONFIRM_REQUIRED / STORAGE_NOT_ALLOWED", "schema": {"type": "object", "additionalProperties": true}}, "403": {"description": "STORAGE_NOT_ALLOWED (페더레이션 피어 주체)", "schema": {"type": "object", "additionalProperties": true}}, "409": {"description": "STORAGE_FORMAT_

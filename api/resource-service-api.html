  <div class="nojs">
    <h1>Nox NVR Resource Service API</h1>
    <p>범용 리소스 관리 서비스 (layout, map, alarm, sensor 등)</p>
    <p>이 문서는 브라우저에서 대화형으로 렌더합니다. JavaScript 를 켜면
       요청·응답 스키마와 예제까지 볼 수 있습니다.</p>
    <h2>오퍼레이션 29개</h2>
    <ul>
      <li><code>GET /health</code> — Health check</li>
      <li><code>GET /resource/api/v1/files</code> — List files and folders</li>
      <li><code>POST /resource/api/v1/files/access-check</code> — Check file access in batch</li>
      <li><code>POST /resource/api/v1/files/folder</code> — Create folder</li>
      <li><code>GET /resource/api/v1/files/search</code> — Search files</li>
      <li><code>POST /resource/api/v1/files/upload</code> — Upload file</li>
      <li><code>GET /resource/api/v1/files/{id}</code> — Get file or folder</li>
      <li><code>PUT /resource/api/v1/files/{id}</code> — Update file or folder</li>
      <li><code>DELETE /resource/api/v1/files/{id}</code> — Delete file or folder</li>
      <li><code>GET /resource/api/v1/files/{id}/download</code> — Download file</li>
      <li><code>GET /resource/api/v1/files/{id}/path</code> — Get file path</li>
      <li><code>GET /resource/api/v1/files/{id}/preview</code> — Preview file</li>
      <li><code>GET /resource/api/v1/files/{id}/sharing</code> — Get file sharing list</li>
      <li><code>POST /resource/api/v1/files/{id}/sharing</code> — Add sharing to file</li>
      <li><code>DELETE /resource/api/v1/files/{id}/sharing/me</code> — Leave file sharing</li>
      <li><code>DELETE /resource/api/v1/files/{id}/sharing/{sharingId}</code> — Remove sharing from file</li>
      <li><code>GET /resource/api/v1/files/{id}/size</code> — Get folder size</li>
      <li><code>GET /resource/api/v1/resources</code> — Get all resources</li>
      <li><code>POST /resource/api/v1/resources</code> — Create new resource</li>
      <li><code>POST /resource/api/v1/resources/access-check</code> — Check resource access in batch</li>
      <li><code>GET /resource/api/v1/resources/search</code> — Search resources</li>
      <li><code>GET /resource/api/v1/resources/type/{type}</code> — Get resources by type</li>
      <li><code>GET /resource/api/v1/resources/{id}</code> — Get resource by ID</li>
      <li><code>PUT /resource/api/v1/resources/{id}</code> — Update resource</li>
      <li><code>DELETE /resource/api/v1/resources/{id}</code> — Delete resource</li>
      <li><code>GET /resource/api/v1/resources/{id}/sharing</code> — Get resource sharing list</li>
      <li><code>POST /resource/api/v1/resources/{id}/sharing</code> — Add sharing to resource</li>
      <li><code>DELETE /resource/api/v1/resources/{id}/sharing/me</code> — Leave resource sharing</li>
      <li><code>DELETE /resource/api/v1/resources/{id}/sharing/{sharingId}</code> — Remove sharing from resource</li>
    </ul>

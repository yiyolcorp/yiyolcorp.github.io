<noscript>
  <div class="nojs">
    <h1>Nox NVR Record Service API</h1>
    <p>RTSP 스트림 녹화 관리 서비스</p>
    <p>이 문서는 브라우저에서 대화형으로 렌더합니다. JavaScript 를 켜면
       요청·응답 스키마와 예제까지 볼 수 있습니다.</p>
    <h2>오퍼레이션 15개</h2>
    <ul>
      <li><code>GET /health</code> — Health check</li>
      <li><code>GET /health/detailed</code> — Detailed health check</li>
      <li><code>GET /record/api/v1/recordings</code> — Get all recordings</li>
      <li><code>POST /record/api/v1/recordings</code> — Create recording</li>
      <li><code>GET /record/api/v1/recordings/by-channel/{channel_id}</code> — Get recordings by channel ID</li>
      <li><code>GET /record/api/v1/recordings/{id}</code> — Get recording by ID</li>
      <li><code>PUT /record/api/v1/recordings/{id}</code> — Update recording</li>
      <li><code>DELETE /record/api/v1/recordings/{id}</code> — Delete recording</li>
      <li><code>GET /record/api/v1/recordings/{id}/event-history</code> — Get event history</li>
      <li><code>GET /record/api/v1/recordings/{id}/event-status</code> — Get event status</li>
      <li><code>POST /record/api/v1/recordings/{id}/toggle</code> — Toggle recording enabled status</li>
      <li><code>POST /record/api/v1/recordings/{id}/trigger</code> — Trigger recording event</li>
      <li><code>GET /record/api/v1/settings/recording</code> — Get recording service settings</li>
      <li><code>POST /record/api/v1/settings/recording</code> — Update recording service settings</li>
      <li><code>POST /record/api/v1/storage/partitions/refresh</code> — Refresh disk partitions</li>
    </ul>
  </div>
</noscript>

<script id="openapi-spec" type="application/json">{"swagger": "2.0", "info": {"description": "\n## 기본 URL\n\n```\nhttps://{서버 주소}/camera\n```\n\n모든 경로는 웹 서버(HTTPS)를 통해 `/camera` 접두로 접근합니다. 아래 각 엔드포인트에\n표기된 경로가 이미 접두를 포함한 실제 호출 경로입니다.\n\n## 인증\n\n모든 요청에 JWT 접근 토큰이 필요합니다.\n\n```\nPOST https://{서버 주소}/auth/api/v1/auth/login\n{ \"username\": \"admin\", \"password\": \"********\" }\n```\n\n응답의 `accessToken` 을 이후 요청 헤더에 부착하십시오.\n\n```\nAuthorization: Bearer {accessToken}\n```\n\n접근 토큰은 기본 10분 후 만료되며, `POST https://{서버 주소}/auth/api/v1/auth/refresh` 로\n갱신합니다.\n\n\n---\n\nJSONB 기반 카메라 관리 서비스", "title": "Nox NVR Camera Service API", "contact": {"name": "API Support", "email": "support@yiyol.com"}, "license": {"name": "Apache 2.0", "url": "http://www.apache.org/licenses/LICENSE-2.0.html"}, "version": "1.0"}, "host": "{서버 주소}", "basePath": "/", "paths": {"/camera/api/v1/cameras": {"get": {"description": "모든 카메라 목록 조회 (JSONB 기반, 사용자 권한에 따라 필터링)", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["Cameras"], "summary": "Get all cameras", "responses": {"200": {"description": "OK", "schema": {"type": "array", "items": {"$ref": "#/definitions/github_com_yiyolcorp_nox_services_camera-service_pkg_models.Camera"}}}, "500": {"description": "Internal Server Error", "schema": {"type": "object", "additionalProperties": true}}}}, "post": {"description": "새 카메라 추가 - 카메라 메타데이터만 등록 (채널/스트림 생성은 별도 API 사용)", "consumes": ["application/json"], "produces": ["application/json"], "tags": ["Cameras"], "summary": "Add new camera", "parameters": [{"description": "Camera data", "name": "camera", "in": "body", "required": true, "schema": {"$ref": "#/definitions/models.CameraCreateRequest"}}], "responses": {"201": {"description": "Created", "schema": {"$ref": "#/definitions/github_com_yiyolcorp_nox_services_camera-service_pkg_models.Camera"}}, "400": {"description": "Bad Request", "schema": {"type": "object", "additionalProperties": true}}, "500": {"description": "Internal Server
